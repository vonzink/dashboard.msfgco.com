<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSFG Email Viewer</title>
  <script src="js/auth-gate.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    #emailList li { border-bottom: 1px solid #e5e7eb; }
    #emailList li:last-child { border-bottom: none; }
    #emailList button:focus { outline: 2px solid #16a34a; outline-offset: -2px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-green-700 text-white px-6 py-4 shadow-md flex items-center justify-between">
    <div><a href="/" class="text-sm underline">Back to dashboard</a><h1 class="text-xl font-bold">MSFG Email Viewer</h1></div>
    <button id="refresh" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded text-sm font-medium transition">
      &#x1F504; Refresh
    </button>
  </header>

  <!-- Main layout -->
  <div class="flex flex-col md:flex-row max-w-7xl mx-auto mt-4 gap-4 px-4 pb-8">

    <!-- Sidebar: Email list -->
    <div class="w-full md:w-1/3 bg-white rounded-lg shadow overflow-hidden">
      <div class="bg-gray-50 px-4 py-3 border-b">
        <h2 class="text-sm font-semibold text-gray-700">info@msfginfo.com</h2><p id="inboxStatus" role="status" class="text-xs text-gray-500 mt-1"></p>
      </div>
      <ul id="emailList" class="divide-y divide-gray-200 max-h-[70vh] overflow-y-auto">
        <p class="p-3 text-gray-500 text-sm">Loading emails...</p>
      </ul>
      <div class="flex justify-between p-3 border-t text-sm">
        <button id="previous" disabled class="text-green-700 disabled:opacity-40">Newer</button>
        <button id="next" disabled class="text-green-700 disabled:opacity-40">Older</button>
      </div>
    </div>

    <!-- Main: Email content -->
    <div class="w-full md:w-2/3 bg-white rounded-lg shadow p-6 min-h-[50vh]">
      <div id="emailContent">
        <p class="text-gray-400 text-sm text-center mt-8">Select an email to view its contents.</p>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/api-server.js"></script>
  <script src="js/info-inbox.js"></script>

  <div class="text-center my-6">
    <button
      onclick="window.open('https://loansifternow.optimalblue.com/', '_blank');"
      class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg shadow font-semibold"
    >
      &#x1F517; Open Optimal Blue Portal
    </button>
  </div>

  <!-- Optimal Blue OBMMI rate index widget -->
  <div class="max-w-7xl mx-auto mb-10 px-4 flex justify-center overflow-x-auto">
    <div style="padding: 8px; background: #dfe3df; border-radius: 8px;
                border-top: 2px solid #9aa09a; border-left: 2px solid #9aa09a;
                border-bottom: 2px solid #ffffff; border-right: 2px solid #ffffff;
                box-shadow: inset 3px 3px 7px rgba(0,0,0,0.35), inset -2px -2px 5px rgba(255,255,255,0.7);">
      <iframe src="https://www2.optimalblue.com/OBMMI/widgetConfig.php?actbg=256320&inactbg=446b1b&rate=23f25a&pos=3a9113&fontFamily=8" width="750" height="462" frameBorder="0" style="display: block; border-radius: 3px;"></iframe>
    </div>
  </div>
</body>
</html>
